{% extends "base_panel.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Nuevo Inventario</h2>

    <form method="POST">
        {% csrf_token %}

        <label class="form-label mt-3">Producto</label>
        <select name="producto" class="form-select" required>
            <option value="">-- Selecciona --</option>
            {% for p in productos %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
            {% endfor %}
        </select>

        <label class="form-label mt-3">Sucursal</label>
        <select name="sucursal" class="form-select" required>
            <option value="">-- Selecciona --</option>
            {% for s in sucursales %}
                <option value="{{ s.id }}">{{ s.nombre }}</option>
            {% endfor %}
        </select>

        <label class="form-label mt-3">Stock</label>
        <input type="number" min="0" name="stock" class="form-control" required>

        <label class="form-label mt-3">Punto de reposición</label>
        <input type="number" min="0" name="reposicion" class="form-control" required>

        <button class="btn btn-success w-100 mt-4">Guardar</button>
        <a href="{% url 'inventario_admin' %}" class="btn btn-secondary w-100 mt-2">Volver</a>
    </form>
</div>
{% endblock %}
