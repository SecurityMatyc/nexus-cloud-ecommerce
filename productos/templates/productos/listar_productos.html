{% extends "base_panel.html" %}

{% block content %}
<div class="container my-5">
    <h2>Listado de productos</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>SKU</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.sku }}</td>
                <td>{{ p.nombre }}</td>
                <td>${{ p.precio }}</td>
                <td>{{ p.categoria }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay productos registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
