{% extends "base_panel.html" %}

{% load static %}

{% block content %}

<section class="container my-5">
    <h2 class="text-center mb-4">Panel de Gerente</h2>
    <p class="text-center text-muted">
        Gestión de inventario, productos, proveedores y reportes.
    </p>

    <div class="row mt-4">

        <!-- Productos -->
        <div class="col-lg-3 col-md-6 mb-4">
            <a href="{% url 'listar_productos' %}" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4">
                    <i class="lni lni-package" style="font-size:40px;"></i>
                    <h5 class="mt-3">Productos</h5>
                    <p class="text-muted small">Administrar productos</p>
                </div>
            </a>
        </div>

        <!-- Proveedores -->
        <div class="col-lg-3 col-md-6 mb-4">
            <a href="{% url 'listar_proveedores' %}" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4">
                    <i class="lni lni-users" style="font-size:40px;"></i>
                    <h5 class="mt-3">Proveedores</h5>
                    <p class="text-muted small">Gestión de proveedores</p>
                </div>
            </a>
        </div>

        <!-- Inventario -->
        <div class="col-lg-3 col-md-6 mb-4">
            <a href="{% url 'listar_inventario' %}" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4">
                    <i class="lni lni-store" style="font-size:40px;"></i>
                    <h5 class="mt-3">Inventario</h5>
                    <p class="text-muted small">Stock y movimientos</p>
                </div>
            </a>
        </div>

        <!-- Reportes -->
        <div class="col-lg-3 col-md-6 mb-4">
            <a href="{% url 'reportes_gerente' %}" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4">
                    <i class="lni lni-bar-chart" style="font-size:40px;"></i>
                    <h5 class="mt-3">Reportes</h5>
                    <p class="text-muted small">Ventas y stock</p>
                </div>
            </a>
        </div>

    </div>
</section>

{% endblock %}
